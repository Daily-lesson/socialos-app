<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06060B">
  <meta name="description" content="SocialOS — AI-powered personal social media manager">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SocialOS">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Social share (link previews — Slack / iMessage / X / Facebook). Absolute
       URLs so crawlers resolve the image from the canonical origin. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SocialOS">
  <meta property="og:title" content="SocialOS">
  <meta property="og:description" content="AI-powered personal social media manager">
  <meta property="og:url" content="https://socialos.fyi/">
  <meta property="og:image" content="https://socialos.fyi/icons/og-image.png?v=3">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SocialOS">
  <meta name="twitter:description" content="AI-powered personal social media manager">
  <meta name="twitter:image" content="https://socialos.fyi/icons/og-image.png?v=3">

  <!-- CSP: no third-party scripts (Section 9 security rule) -->
  <!-- style-src needs 'unsafe-inline': UI templates set platform colors and
       progress widths via style attributes. Scripts stay locked to 'self'.
       No api.anthropic.com — all Claude calls MUST go through the Supabase
       Edge Function proxy (*.supabase.co), never directly.
       No www.linkedin.com/api.linkedin.com/www.reddit.com/oauth.reddit.com/
       www.tiktok.com/open.tiktokapis.com either (Phase 5, js/linkedin.js +
       js/reddit.js + js/tiktok.js) — deliberately absent.
       None of those endpoints set CORS headers for browser callers anyway
       (see docs/ROADMAP.md §2), so every LinkedIn/Reddit/TikTok call is
       relayed through one shared Supabase Edge Function (*.supabase.co,
       already allowed below); this CSP is what makes it impossible for a
       bug to accidentally call any of those platforms directly instead.
       The OAuth *authorize* redirect is a top-level navigation
       (window.location.href), not a fetch, so it isn't governed by
       connect-src at all — same for Google's accounts.google.com page.
       No oauth2.googleapis.com either: Google token exchange/refresh/revoke
       all happen server-side in the google-oauth Edge Function
       (*.supabase.co), so the client secret never exists in the browser and
       this CSP makes a direct token call impossible by construction. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self';
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                 font-src https://fonts.gstatic.com;
                 connect-src 'self' https://*.supabase.co https://www.googleapis.com https://photospicker.googleapis.com https://*.googleusercontent.com;
                 img-src 'self' data: blob: https:;">

  <title>SocialOS</title>

  <!-- PWA. The apple-touch-icon comes FIRST and exactly once, sized: iOS
       Safari reads it when the user taps "Add to Home Screen". An iPhone was
       showing the generic Safari tile for SocialOS before v3 even though this
       link served 200 image/png — the cause is NOT confirmed (an iOS-side
       cache of an earlier failure, private browsing and a transient fetch
       failure all fit); this head order, the cache-bust and the root
       fallbacks /apple-touch-icon-precomposed.png + /apple-touch-icon.png
       (the paths iOS probes when no link is declared — written by
       icons/_src/build-icons.py) are hardening, and the acceptance test is
       re-adding the app on the phone. Hrefs stay RELATIVE: the public mirror
       serves the app under /socialos-app/, where a root-relative href would
       404 (the root fallbacks only serve the socialos.fyi origin).
       ?v=3 busts the per-URL icon caches (iOS Safari keeps a stale
       apple-touch-icon even across remove/re-add of the home-screen app) —
       bump it (and sw.js SHELL_ASSETS + CACHE_NAME) whenever the art changes. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=3">
  <link rel="manifest" href="manifest.json">

  <!-- Fonts (Section 6 typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

  <!-- Styles -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <div id="app">

    <!-- ═══ Landing Screen (signed-out / pre-onboarding) ═══ -->
    <div id="screen-landing" class="screen screen-full active">
      <div id="landing-content"></div>
    </div>

    <!-- ═══ Onboarding Screen ═══ -->
    <div id="screen-onboarding" class="screen">
      <div id="onboarding-content"></div>
    </div>

    <!-- ═══ Dashboard Screen ═══ -->
    <div id="screen-dashboard" class="screen">
      <div id="dashboard-content"></div>
    </div>

    <!-- ═══ Compose Screen (Quick Post) ═══ -->
    <div id="screen-compose" class="screen">
      <div id="compose-content"></div>
    </div>

    <!-- ═══ Approvals Screen ═══ -->
    <div id="screen-approvals" class="screen">
      <!-- Inbox = Approvals + the agent Queue behind one tab. Static per
           screen (each copy marks its own half current), navigates via go-*. -->
      <div class="inbox-switch" role="group" aria-label="Inbox">
        <button class="inbox-switch-btn is-active" aria-current="true" data-action="go-approvals">Your posts <span class="inbox-switch-count" data-inbox-count="posts" hidden></span></button>
        <button class="inbox-switch-btn" data-action="go-queue">Agent drafts <span class="inbox-switch-count" data-inbox-count="agents" hidden></span></button>
      </div>
      <div id="approvals-content"></div>
    </div>

    <!-- ═══ Front Office Queue Screen (agent drafts awaiting review) ═══ -->
    <div id="screen-queue" class="screen">
      <!-- Inbox = Approvals + the agent Queue behind one tab. Static per
           screen (each copy marks its own half current), navigates via go-*. -->
      <div class="inbox-switch" role="group" aria-label="Inbox">
        <button class="inbox-switch-btn" data-action="go-approvals">Your posts <span class="inbox-switch-count" data-inbox-count="posts" hidden></span></button>
        <button class="inbox-switch-btn is-active" aria-current="true" data-action="go-queue">Agent drafts <span class="inbox-switch-count" data-inbox-count="agents" hidden></span></button>
      </div>
      <div id="queue-content"></div>
    </div>

    <!-- ═══ Work Orders Screen (Scot's cross-project task list, read from alys) ═══ -->
    <div id="screen-workorders" class="screen">
      <div class="screen-back-row"><button class="screen-back" data-action="go-dashboard" aria-label="Back to Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Home</button></div>
      <div id="workorders-content"></div>
    </div>

    <!-- ═══ Calendar Screen ═══ -->
    <div id="screen-calendar" class="screen">
      <div class="screen-back-row"><button class="screen-back" data-action="go-dashboard" aria-label="Back to Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Home</button></div>
      <div id="calendar-content"></div>
    </div>

    <!-- ═══ Content Library Screen ═══ -->
    <div id="screen-library" class="screen">
      <div class="screen-back-row"><button class="screen-back" data-action="go-dashboard" aria-label="Back to Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Home</button></div>
      <div id="library-content"></div>
    </div>

    <!-- ═══ Projects Screen (Program Manager) ═══ -->
    <div id="screen-projects" class="screen">
      <div class="screen-back-row"><button class="screen-back" data-action="go-dashboard" aria-label="Back to Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Home</button></div>
      <div id="projects-content"></div>
    </div>

    <!-- ═══ Settings Screen ═══ -->
    <div id="screen-settings" class="screen">
      <div class="screen-back-row"><button class="screen-back" data-action="go-dashboard" aria-label="Back to Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Home</button></div>
      <div id="settings-content"></div>
    </div>

    <!-- ═══ Main Navigation — bottom bar on mobile, sidebar on desktop ═══ -->
    <nav id="main-nav" style="display:none" aria-label="Main">
      <div class="nav-brand" aria-hidden="true">
        <img class="nav-brand-mark" src="icons/logo.svg" alt="" width="34" height="34">
        <span class="nav-brand-name">Social<em>OS</em></span>
      </div>

      <!-- Three tabs, never more. Every other screen hangs off one of them:
           data-also lists the screens that light the tab up (ui.js showScreen),
           and they are reached from Home's tiles / the Inbox switch. A new
           screen gets a Home tile, not a fourth tab. -->
      <div class="nav-tabs">
        <button class="nav-tab" data-screen="screen-dashboard" data-also="screen-calendar screen-library screen-projects screen-workorders screen-settings">
          <span class="nav-tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
          </span>
          <span class="nav-tab-label">Home</span>
        </button>
        <button class="nav-tab nav-tab-create" data-screen="screen-compose">
          <span class="nav-tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          </span>
          <span class="nav-tab-label">Create</span>
        </button>
        <button class="nav-tab" data-screen="screen-approvals" data-also="screen-queue">
          <span class="nav-tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.7 4H7.3a2 2 0 0 0-1.8 1.1z"/></svg>
          </span>
          <span class="nav-tab-label">Inbox</span>
          <span class="nav-badge" id="approval-badge">0</span>
        </button>
      </div>
    </nav>

  </div>

  <!-- ═══ Overlays ═══ -->

  <!-- Hidden file input: "Upload from device" media source -->
  <input type="file" id="local-file-input" accept="image/*,video/*" multiple hidden>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-message">Loading...</div>
  </div>

  <!-- Bottom sheet (confirmations) -->
  <div id="bottom-sheet">
    <div id="bottom-sheet-content"></div>
  </div>

  <!-- Feedback: persistent entry point (self-healing feedback loop) -->
  <button id="feedback-fab" class="feedback-fab" data-action="open-feedback" aria-label="Send feedback">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/><path d="M9 11h6M9 14h3"/></svg>
  </button>

  <!-- App version — small, muted. js/version.js fills it (window.SOCIALOS_VERSION
       lives there: an inline script here was blocked by the CSP above). -->
  <a id="version-badge" class="version-badge" href="https://semver.org" target="_blank" rel="noopener noreferrer" aria-label="App version"></a>

  <!-- ═══ Scripts (order matters — no modules, no bundler) ═══ -->
  <!-- self-healing.js has no dependencies and installs window.onerror /
       unhandledrejection from SocialOS.init(); it must load first so early
       errors during boot are still catchable. -->
  <script src="js/self-healing.js"></script>
  <script src="js/version.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/media.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/google.js"></script>
  <script src="js/linkedin.js"></script>
  <script src="js/reddit.js"></script>
  <script src="js/tiktok.js"></script>
  <script src="js/linker.js"></script>
  <script src="js/growth.js"></script>
  <script src="js/pm.js"></script>
  <script src="js/engagement.js"></script>
  <script src="js/composer.js"></script>
  <script src="js/queue.js"></script>
  <script src="js/workorders.js"></script>
  <script src="js/push.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
