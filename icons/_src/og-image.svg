<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- SOURCE MASTER — social share card (og:image / twitter:image), 1200x630.
       Rasterized by icons/_src/build-icons.py. v2 look: the new gradient app
       tile (white mark on blue→purple, matching icon-square.svg) + wordmark
       on the dark field so shared links carry SocialOS branding. -->
  <defs>
    <linearGradient id="tilebg" x1="0" y1="512" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D7BF0"/>
      <stop offset="0.5" stop-color="#7A66F4"/>
      <stop offset="1" stop-color="#B04FF7"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.30" cy="0.16" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg" cx="0.30" cy="0.18" r="1.1">
      <stop offset="0" stop-color="#181828"/>
      <stop offset="1" stop-color="#0A0A0F"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FB4FF"/>
      <stop offset="1" stop-color="#C9A2FF"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- The gradient app tile, left-of-centre at ~330px tall -->
  <g transform="translate(150 148) scale(0.655)">
    <g clip-path="url(#tile)">
      <rect width="512" height="512" fill="url(#tilebg)"/>
      <rect width="512" height="512" fill="url(#sheen)"/>
    </g>
    <g transform="translate(-16 16)">
      <g transform="translate(0 9)" opacity="0.18">
        <path d="M 328 184 A 72 72 0 1 0 256 256 A 72 72 0 1 1 184 328"
              fill="none" stroke="#141033" stroke-width="50" stroke-linecap="round"/>
        <circle cx="184" cy="328" r="35" fill="#141033"/>
        <circle cx="328" cy="184" r="41" fill="#141033"/>
      </g>
      <path d="M 328 184 A 72 72 0 1 0 256 256 A 72 72 0 1 1 184 328"
            fill="none" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round"/>
      <circle cx="184" cy="328" r="35" fill="#FFFFFF"/>
      <circle cx="184" cy="328" r="13" fill="url(#tilebg)"/>
      <circle cx="328" cy="184" r="41" fill="#FFFFFF"/>
      <circle cx="328" cy="184" r="15" fill="url(#tilebg)"/>
      <circle cx="328" cy="184" r="67" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.5"/>
      <circle cx="376" cy="139" r="12" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <text x="560" y="300" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="104" font-weight="700" fill="url(#word)">SocialOS</text>
  <text x="562" y="360" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="38" font-weight="400" fill="#9A9AB0">Your AI social-media manager</text>
</svg>
