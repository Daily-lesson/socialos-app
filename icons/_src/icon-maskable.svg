<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    SOURCE MASTER — maskable app icon. Same gradient field as icon-square.svg,
    but the mark is scaled to ~80% and centred so it stays inside the maskable
    "safe zone" (the centre 80% circle) that Android's adaptive-icon shapes
    crop to. Rasterized by icons/_src/build-icons.py. v2 look: white mark on
    the brand blue→purple gradient (see icon-square.svg for why).
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="512" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D7BF0"/>
      <stop offset="0.5" stop-color="#7A66F4"/>
      <stop offset="1" stop-color="#B04FF7"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.30" cy="0.16" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#sheen)"/>

  <!-- Recentre the mark's visual centre (~272,240) to canvas centre, then
       scale to 0.80 about the centre for comfortable maskable margins. -->
  <g transform="translate(256 256) scale(0.80) translate(-256 -256) translate(-16 16)">
    <g transform="translate(0 9)" opacity="0.18">
      <path d="M 328 184 A 72 72 0 1 0 256 256 A 72 72 0 1 1 184 328"
            fill="none" stroke="#141033" stroke-width="50" stroke-linecap="round"/>
      <circle cx="184" cy="328" r="35" fill="#141033"/>
      <circle cx="328" cy="184" r="41" fill="#141033"/>
    </g>

    <path d="M 328 184 A 72 72 0 1 0 256 256 A 72 72 0 1 1 184 328"
          fill="none" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round"/>
    <circle cx="184" cy="328" r="35" fill="#FFFFFF"/>
    <circle cx="184" cy="328" r="13" fill="url(#bg)"/>
    <circle cx="328" cy="184" r="41" fill="#FFFFFF"/>
    <circle cx="328" cy="184" r="15" fill="url(#bg)"/>
    <circle cx="328" cy="184" r="67" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.5"/>
    <circle cx="376" cy="139" r="12" fill="#FFFFFF"/>
  </g>
</svg>
