<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    SOURCE MASTER — app icon (full-bleed square). Rasterized to the app-icon
    PNGs (and the root apple-touch-icon fallbacks) by icons/_src/build-icons.py.
    Full opaque square: Apple home-screen icons must NOT be transparent (iOS
    renders transparency as black) and it rounds the corners itself, so the
    art is a plain square here.

    v3 look — "Night Shift": a midnight sky with dawn rising at the foot of
    the tile; the S-route is a lit ribbon running from you (bottom-left node,
    a crescent — asleep) to done (top-right node, a check) by morning. That is
    the whole product in one mark: staff that works while Scot sleeps, and a
    work-order manager, not just a social broadcast route. Keep in sync with
    icon-maskable.svg, og-image.svg and icons/logo.svg — the mark body is
    identical in all four (the same MARK block; edit once, paste four times).

    No SVG filters: cairosvg does not render them, so the glow is stacked
    translucent strokes. Gradients are userSpaceOnUse so the maskable/logo
    transforms keep the same colour at the same point of the mark.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070A1F"/>
      <stop offset="0.55" stop-color="#141743"/>
      <stop offset="1" stop-color="#2A1E5C"/>
    </linearGradient>
    <radialGradient id="dawn" cx="256" cy="600" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB56B" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#FF7A8A" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#8A5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8A5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="184" y1="328" x2="328" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4DBFF"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF6E3"/>
    </linearGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#dawn)"/>
  <!-- night sky: a handful of stars, upper half only -->
  <g fill="#FFFFFF">
    <circle cx="70" cy="62" r="2.2" opacity="0.7"/>
    <circle cx="118" cy="120" r="1.6" opacity="0.45"/>
    <circle cx="430" cy="80" r="2.6" opacity="0.8"/>
    <circle cx="470" cy="150" r="1.6" opacity="0.5"/>
    <circle cx="380" cy="42" r="1.4" opacity="0.5"/>
    <circle cx="40" cy="200" r="1.4" opacity="0.4"/>
    <circle cx="250" cy="40" r="1.3" opacity="0.4"/>
  </g>
  <!-- recentre the mark's visual centre (~272,240) onto the canvas centre -->
  <g transform="translate(-16 16)">
    <!-- glow: stacked wide strokes, no SVG filters (cairosvg-safe) -->
    <g fill="none" stroke="#B79CFF" stroke-linecap="round">
      <path d="M 328 184 A 72 72 0 1 0 256 256 A 72 72 0 1 1 184 328" stroke-width="96" opacity="0.08"/>
      <path d="M 328 184 A 72 72 0 1 0 256 256 A 72 72 0 1 1 184 328" stroke-width="70" opacity="0.14"/>
    </g>
    <!-- the route: you (bottom-left) to done (top-right) -->
    <path d="M 328 184 A 72 72 0 1 0 256 256 A 72 72 0 1 1 184 328" fill="none" stroke="url(#ribbon)" stroke-width="50" stroke-linecap="round"/>
    <!-- origin node: you, asleep — a crescent -->
    <circle cx="184" cy="328" r="50" fill="#B79CFF" opacity="0.16"/>
    <circle cx="184" cy="328" r="36" fill="#E4DBFF"/>
    <circle cx="184" cy="328" r="16" fill="#1A1A4A"/>
    <circle cx="190" cy="323" r="14" fill="#E4DBFF"/>
    <!-- destination node: done by morning — a check, with a warm halo -->
    <circle cx="328" cy="184" r="70" fill="#FFD9A0" opacity="0.12"/>
    <circle cx="328" cy="184" r="67" fill="none" stroke="#FFE7BF" stroke-width="7" opacity="0.55"/>
    <circle cx="328" cy="184" r="42" fill="#FFFFFF"/>
    <path d="M 309 186 L 322 199 L 348 170" fill="none" stroke="#2A1E5C" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- satellite on the halo -->
    <circle cx="378" cy="139" r="13" fill="#FFE7BF"/>
    <circle cx="378" cy="139" r="26" fill="url(#star)" opacity="0.5"/>
  </g>
</svg>
