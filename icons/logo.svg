<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    SocialOS mark: an "S" drawn as a connection route — two circular arcs
    from a small node (your real work, bottom-left) up to a larger node
    with a broadcast halo (your audience, top-right).
    v2 look: white mark on the brand blue→purple gradient tile (matches the
    app-icon masters in icons/_src/). In-app nav + landing mark; master file,
    rasterize with any SVG renderer.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="512" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D7BF0"/>
      <stop offset="0.5" stop-color="#7A66F4"/>
      <stop offset="1" stop-color="#B04FF7"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.30" cy="0.16" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <!-- Rounded-square field (iOS-style 22.5% radius) -->
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#sheen)"/>
  </g>

  <!-- Recentre the mark (visual centre ~(272,240)) onto the canvas centre -->
  <g transform="translate(-16 16)">
    <g transform="translate(0 9)" opacity="0.18">
      <path d="M 328 184 A 72 72 0 1 0 256 256 A 72 72 0 1 1 184 328"
            fill="none" stroke="#141033" stroke-width="50" stroke-linecap="round"/>
      <circle cx="184" cy="328" r="35" fill="#141033"/>
      <circle cx="328" cy="184" r="41" fill="#141033"/>
    </g>

    <!-- The route: a proper S from two 270° arcs -->
    <path d="M 328 184 A 72 72 0 1 0 256 256 A 72 72 0 1 1 184 328"
          fill="none" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round"/>
    <!-- Origin node (small, bottom-left) -->
    <circle cx="184" cy="328" r="35" fill="#FFFFFF"/>
    <circle cx="184" cy="328" r="13" fill="url(#bg)"/>
    <!-- Destination node (larger, top-right) with broadcast halo -->
    <circle cx="328" cy="184" r="41" fill="#FFFFFF"/>
    <circle cx="328" cy="184" r="15" fill="url(#bg)"/>
    <circle cx="328" cy="184" r="67" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.5"/>
    <!-- Satellite on the halo -->
    <circle cx="376" cy="139" r="12" fill="#FFFFFF"/>
  </g>
</svg>
